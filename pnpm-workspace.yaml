packages:
  - packages/*
  - examples/*
  - benchmarks
  - docs
  - e2e
  - e2e/bundlers/*
  - readme-assets

overrides:
  "@yak/swc": workspace:*
  # Every copy of @swc/core in the workspace must stay on the ABI line the
  # yak-swc wasm plugin is built for (see the core catalog). Storybook's
  # webpack builder runs the plugin through its own swc-loader, so a second,
  # newer @swc/core would break it.
  "@swc/core": catalog:core
  # Types for the docs playground editor (the editor itself loads from a CDN).
  # @monaco-editor/react 4.7 imports `monaco-editor/esm/vs/editor/editor.api`,
  # which the export map of 0.55 and later does not resolve.
  monaco-editor: 0.54.0

# Only install versions published at least a day ago
minimumReleaseAge: 1440

allowBuilds:
  "@parcel/watcher": false
  "@swc/core": true
  esbuild: true
  sharp: true
  unrs-resolver: true
  wasm-pack: true

catalogs:
  # These should be kept at the lowest version we need and only updated if a new major version is available or CVE's dropped
  core:
    "@babel/parser": ^8.0.0
    "@oxlint/plugins": ^1.81.0
    "@solidjs/web": ^2.0.0-rc.15
    # Keep in sync with swc_core in packages/yak-swc/Cargo.toml and next.js version of bundled SWC
    "@swc/core": ~1.16.18
    "@swc/counter": ^0.1.3
    solid-js: ^2.0.0-rc.15
  dev:
    "@base-ui/react": 1.9.0
    "@babel/standalone": 8.1.3
    "@babel/types": 8.1.3
    "@fontsource/hanken-grotesk": 5.3.0
    "@rsbuild/core": 2.3.3
    "@rsbuild/plugin-react": 2.1.1
    "@changesets/changelog-github": 1.0.1
    "@changesets/cli": 3.0.3
    "@monaco-editor/react": 4.7.0
    "@next/eslint-plugin-next": 16.4.6
    "@playwright/test": 1.65.1
    "@shikijs/monaco": 4.6.0
    "@storybook/addon-docs": 11.0.0-alpha.6
    "@storybook/addon-webpack5-compiler-swc": 4.0.6
    "@storybook/react": 11.0.0-alpha.6
    "@storybook/react-vite": 11.0.0-alpha.6
    "@storybook/react-webpack5": 11.0.0-alpha.6
    "@swc/helpers": 0.5.24
    "@tanstack/react-router": 1.170.46
    "@tanstack/react-start": 1.169.7
    "@testing-library/dom": 10.4.2
    "@testing-library/react": 16.3.3
    "@types/jest": 30.0.0
    "@types/node": 26.6.6
    "@types/subset-font": 2.3.0
    "@types/react": 19.3.0
    "@types/react-dom": 19.3.0
    "@types/webpack": 5.28.5
    "@typescript-eslint/parser": 8.73.0
    "@typescript-eslint/rule-tester": 8.73.0
    "@vitejs/plugin-react": 6.3.0
    "@vitejs/plugin-react-swc": 4.3.3
    "@vitejs/plugin-rsc": 0.5.39
    eslint: 10.15.0
    eslint-config-next: 16.4.6
    eslint-doc-generator: 3.7.1
    fflate: 0.8.3
    fumadocs-core: 16.19.7
    fumadocs-mdx: 15.6.4
    fumadocs-twoslash: 4.0.5
    jest: 30.5.2
    "@testing-library/jest-dom": 8.0.0
    jest-environment-jsdom: 30.5.2
    js-base64: 3.9.7
    jsdom: 31.0.1
    knip: 6.47.0
    next: 16.4.6
    oxfmt: 0.79.0
    oxlint: 1.94.0
