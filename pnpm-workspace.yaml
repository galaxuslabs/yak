packages:
  - packages/*

# Only install versions published at least a day ago
minimumReleaseAge: 1440
# Babel 8.1.2 fixes babel/babel#18264. Remove this after 2026-11-12 20:00 UTC.
minimumReleaseAgeExclude:
  - "@babel/*"

allowBuilds:
  esbuild: true

catalog:
  "@babel/parser": 8.1.2
  "@babel/traverse": 8.1.2
  "@babel/types": 8.1.2
  "@changesets/cli": 3.0.1
  "@types/node": 26.4.1
  knip: 6.34.0
  magic-string: 1.4.5
  oxfmt: 0.66.0
  oxlint: 1.81.0
  tsdown: 0.22.14
  typescript: 6.0.3
  vitest: 4.1.11
