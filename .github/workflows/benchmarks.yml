name: benchmarks

on:
  pull_request:
    branches: ["main"]
    paths:
      - "packages/yak-react/runtime/**"
      - "benchmarks/**"
      - ".github/workflows/benchmarks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  approve-fork:
    name: Approve benchmarks for a fork PR
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-slim
    environment: benchmarks-fork
    permissions: {}
    steps:
      - run: echo "Benchmarks approved"

  benchmarks:
    name: Run benchmarks and post results
    needs: approve-fork
    if: ${{ !cancelled() && (needs.approve-fork.result == 'success' || needs.approve-fork.result == 'skipped') }}
    runs-on: yak-benchmark-runner
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        name: Install pnpm
        with:
          run_install: false

      - name: Add Rust wasm targets
        run: rustup target add wasm32-wasip1 wasm32-unknown-unknown

      - name: Enable Rust caching
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: packages/yak-swc

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@2f8e54208210a422b2efd51efaa6bd6d7ca8920f # v3.4.3
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # ----- Pass 1: build the benchmark suite of the PR's target branch -----
      # Each baseline step uses `continue-on-error`, so a broken target branch
      # only leaves the main columns out of the results.
      - name: Switch to baseline ref
        continue-on-error: true
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git checkout "origin/${BASE_REF}"

      - name: Install dependencies (baseline)
        continue-on-error: true
        run: pnpm install

      - name: Build SWC plugin (baseline)
        continue-on-error: true
        run: pnpm run build:swc

      - name: Build yak (baseline)
        continue-on-error: true
        run: pnpm run build

      - name: Generate benchmark sources (baseline)
        continue-on-error: true
        working-directory: benchmarks
        run: pnpm run generate

      - name: Build benchmark suite (baseline)
        continue-on-error: true
        working-directory: benchmarks
        run: pnpm run bench:build

      # The bundle holds the yak runtime of the target branch, so it still runs after the PR checkout
      - name: Keep baseline benchmark suite
        continue-on-error: true
        working-directory: benchmarks
        run: rm -rf bench/dist-base && mv bench/dist bench/dist-base

      # ----- Pass 2: PR head -----
      - name: Switch to PR head
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git checkout "${PR_HEAD_SHA}"

      - name: Install dependencies (PR)
        run: pnpm install

      - name: Build SWC plugin (PR)
        run: pnpm run build:swc

      - name: Build yak (PR)
        run: pnpm run build

      - name: Generate benchmark sources (PR)
        working-directory: benchmarks
        run: pnpm run generate

      - name: Build benchmark suite (PR)
        working-directory: benchmarks
        run: pnpm run bench:build

      # Runs each case for main and PR in turns, see bench/rounds.ts
      - name: Run benchmarks
        working-directory: benchmarks
        run: pnpm --silent run bench:rounds --rounds 3

      - name: Write results table
        working-directory: benchmarks
        run: pnpm --silent run bench:report bench/runs > bench-table.html

      # The token of a fork PR is read-only and cannot comment, so the job summary shows the results.
      - name: Write job summary
        run: cat benchmarks/bench-table.html >> "$GITHUB_STEP_SUMMARY"

      - name: Upsert PR comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          MARKER='<!-- next-yak-benchmark-results -->'
          TABLE=$(cat benchmarks/bench-table.html)

          BODY=$(cat <<EOF
          ${MARKER}
          ## Benchmark results

          ${TABLE}

          <sub>Commit: \`${COMMIT_SHA}\` • <a href="${RUN_URL}">workflow run</a></sub>
          EOF
          )

          EXISTING_ID=$(gh api \
            "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" \
            --paginate \
            --jq "[.[] | select(.body | startswith(\"${MARKER}\"))][0].id")

          if [ -n "$EXISTING_ID" ] && [ "$EXISTING_ID" != "null" ]; then
            echo "Updating comment ${EXISTING_ID}"
            gh api --method PATCH \
              "repos/${GH_REPO}/issues/comments/${EXISTING_ID}" \
              -f body="$BODY" > /dev/null
          else
            echo "Creating new comment"
            gh api --method POST \
              "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" \
              -f body="$BODY" > /dev/null
          fi
